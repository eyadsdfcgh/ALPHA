<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALPHA | قيد الصيانة</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--primary:#A020F0;--text:#f0f0ff;--text-muted:rgba(240,240,255,.55);--border:rgba(160,32,240,.25);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.18;animation:floatOrb 8s ease-in-out infinite;pointer-events:none;}
.bg-orb-1{width:600px;height:600px;background:radial-gradient(circle,#A020F0,transparent);top:-200px;left:-150px;}
.bg-orb-2{width:500px;height:500px;background:radial-gradient(circle,#7c3aed,transparent);bottom:-150px;right:-100px;animation-delay:-4s;}
@keyframes floatOrb{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
.grid-lines{position:fixed;inset:0;background-image:linear-gradient(rgba(160,32,240,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(160,32,240,.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;}
.card{position:relative;z-index:10;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:28px;padding:3.5rem 3rem;max-width:520px;width:92%;text-align:center;box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 60px rgba(160,32,240,.1),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(20px);animation:cardIn .7s cubic-bezier(.16,1,.3,1) forwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.gear-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;margin-bottom:2rem;}
.gear-glow{position:absolute;width:120px;height:120px;background:radial-gradient(circle,rgba(160,32,240,.5),transparent 70%);border-radius:50%;animation:pulse 2.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.3);opacity:1}}
.gear-icon{font-size:4.5rem;animation:spinGear 4s linear infinite;position:relative;z-index:1;filter:drop-shadow(0 0 20px rgba(160,32,240,.8));}
@keyframes spinGear{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.logo{font-size:1.4rem;font-weight:900;background:linear-gradient(135deg,#A020F0,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;margin-bottom:.5rem;}
.title{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.75rem;line-height:1.2;}
.subtitle{font-size:1rem;color:var(--text-muted);line-height:1.7;margin-bottom:2rem;}
.status-badge{display:inline-flex;align-items:center;gap:.5rem;background:rgba(160,32,240,.12);border:1px solid rgba(160,32,240,.3);border-radius:100px;padding:.55rem 1.4rem;font-size:.88rem;font-weight:700;color:#c4b5fd;letter-spacing:.5px;margin-bottom:2rem;}
.status-dot{width:8px;height:8px;background:#f59e0b;border-radius:50%;animation:blink 1.2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 6px #f59e0b}50%{opacity:.3;box-shadow:none}}
.progress-bar-wrap{background:rgba(255,255,255,.06);border-radius:100px;height:6px;overflow:hidden;margin-bottom:2.5rem;}
.progress-bar-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,#A020F0,#7c3aed,#f59e0b);background-size:200% 100%;animation:progressGlow 2s linear infinite;}
@keyframes progressGlow{0%{background-position:0% 50%;width:30%}50%{background-position:100% 50%;width:75%}100%{background-position:0% 50%;width:30%}}
.info-row{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:.82rem;color:var(--text-muted);border-top:1px solid rgba(255,255,255,.06);padding-top:1.5rem;}
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
.particle{position:absolute;border-radius:50%;background:rgba(160,32,240,.5);animation:rise linear infinite;}
@keyframes rise{from{transform:translateY(100vh) scale(0);opacity:.8}to{transform:translateY(-100px) scale(1);opacity:0}}
@media(max-width:520px){.card{padding:2.5rem 1.5rem}.title{font-size:1.6rem}.gear-icon{font-size:3.5rem}}
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="grid-lines"></div>
<div class="particles" id="particles"></div>
<div class="card">
  <div class="gear-wrap">
    <div class="gear-glow"></div>
    <div class="gear-icon">&#9881;&#65039;</div>
  </div>
  <div class="logo">&#9889; ALPHA</div>
  <h1 class="title">الموقع قيد الصيانة</h1>
  <p class="subtitle">نقوم حاليًا بتحديث وتحسين المنصة لتقديم أفضل تجربة لك.<br>سنعود قريبًا بشكل أقوى وأسرع! &#128640;</p>
  <div class="status-badge">
    <span class="status-dot"></span>
    جارس العمل على التحسينات...
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill"></div></div>
  <div class="info-row">
    <span>&#9889; ALPHA Trading Platform</span>
    <span>&middot;</span>
    <span>سنعود قريبًا</span>
  </div>
</div>
<script>
var c=document.getElementById('particles');
for(var i=0;i<20;i++){
  var p=document.createElement('div');
  p.className='particle';
  var s=Math.random()*4+2;
  p.style.width=s+'px';
  p.style.height=s+'px';
  p.style.left=(Math.random()*100)+'%';
  p.style.animationDuration=(Math.random()*10+8)+'s';
  p.style.animationDelay=(Math.random()*-15)+'s';
  c.appendChild(p);
}
</script>
</body>
</html>
